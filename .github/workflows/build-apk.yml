name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch Quran (QCF4 Madani Mushaf) and verify it
        run: |
          mkdir -p /tmp/qpkg && cd /tmp/qpkg
          npm pack quran-qcf4@1.1.0
          tar xzf quran-qcf4-1.1.0.tgz
          cd "$GITHUB_WORKSPACE"
          python3 tools/prepare_quran.py /tmp/qpkg/package app/src/main/assets/quran

      - name: Fetch UI font (IBM Plex Sans Arabic, OFL) - optional
        continue-on-error: true
        run: |
          mkdir -p /tmp/fpkg && cd /tmp/fpkg
          npm pack @fontsource/ibm-plex-sans-arabic@5.3.0
          tar xzf fontsource-ibm-plex-sans-arabic-5.3.0.tgz
          for w in 300 400 500 600; do for sub in arabic latin; do
            cp "package/files/ibm-plex-sans-arabic-$sub-$w-normal.woff2" "$GITHUB_WORKSPACE/app/src/main/assets/fonts/"
          done; done
          cp package/LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/fonts/IBMPlexSansArabic-LICENSE.txt" || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Istighfar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Istighfar-APK
          path: Istighfar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Istighfar ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: Istighfar.apk
